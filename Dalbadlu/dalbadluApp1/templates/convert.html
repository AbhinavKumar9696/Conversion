<!DOCTYPE html>
<html>
<head>
    <title>File Converter</title>
</head>
<body>

<h2>Convert File</h2>

{% if message %}
    <p style="color: green;">{{ message }}</p>
{% endif %}

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <p><strong>Select Conversion Type:</strong></p>
    {{ form.conversion_type }}

    <br><br>

    <p><strong>Upload File:</strong></p>
    {{ form.original_file }}

    <br><br>

    <button type="submit">Convert</button>
</form>

<!-- 👇 Download Button -->
{% if file_url %}
    <br><br>
    <a href="{{ file_url }}" download>
        <button>Download Converted File</button>
    </a>
{% endif %}

</body>
</html>
